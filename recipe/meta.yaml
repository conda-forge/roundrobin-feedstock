{% set version = "0.1.0" %}

package:
  name: roundrobin
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/r/roundrobin/roundrobin-{{ version }}.tar.gz
    sha256: 14126ed1706a9c6638c81c3f3d915357f7ab0c0245c464a611eb5903811ee45b

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - roundrobin
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/linnik/roundrobin
  summary: Collection of roundrobin utilities
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bollwyvl
